# Netlify. Na Vercel este arquivo e ignorado, e vale o vercel.json.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sem barra no fim das URLs, igual ao trailingSlash do astro.config.mjs.
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
